<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesapçı - Gerçek Zenginlik Testi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3852960467508583" crossorigin="anonymous"></script>
    <style>
        :root { --bg: #0a0a1a; --card: #12122c; --accent: #00ff88; --text: #e0e0ff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height:100vh; padding:20px; }
        .container { max-width: 700px; margin: 40px auto; }
        .card { background: var(--card); border-radius: 30px; padding: 50px; box-shadow: 0 20px 60px rgba(0,255,136,0.15); border: 1px solid rgba(0,255,136,0.2); }
        h1 { font-size: 3.5em; text-align: center; background: linear-gradient(90deg, #00ff88, #00ccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .subtitle { text-align:center; font-size:1.3em; margin-bottom:40px; opacity:0.9; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom:40px; }
        .full { grid-column: 1 / -1; }
        label { display:block; margin-bottom:10px; font-weight:600; color:#00ff88; }
        input, select { width:100%; padding:18px; border-radius:15px; border:none; background:rgba(255,255,255,0.1); color:white; font-size:18px; }
        input::placeholder { color:rgba(255,255,255,0.6); }
        button { width:100%; padding:22px; background: linear-gradient(45deg, #ff6b6b, #feca57); color:white; border:none; border-radius:20px; font-size:2em; font-weight:900; cursor:pointer; margin:40px 0; box-shadow:0 15px 40px rgba(255,107,107,0.4); transition:0.4s; }
        button:hover { transform:translateY(-8px); box-shadow:0 25px 60px rgba(255,107,107,0.6); }
        #result { margin-top:60px; padding:40px; background:rgba(0,255,136,0.1); border-radius:25px; font-size:1.6em; line-height:2; text-align:center; display:none; }
        .chart { height:300px; margin:40px 0; }
        .share { text-align:center; margin-top:40px; }
        .share a { display:inline-block; margin:0 15px; padding:15px 30px; background:#00ff88; color:black; text-decoration:none; border-radius:15px; font-weight:bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Hesapçı</h1>
            <p class="subtitle">65 yaşında ne kadar zengin olacaksın? Gerçek analiz, 1 reklamla ücretsiz!</p>
            
            <div class="form-grid">
                <div>
                    <label>Yaşın</label>
                    <input type="number" id="age" value="28">
                </div>
                <div>
                    <label>Aylık Net Gelirin (TL)</label>
                    <input type="number" id="income" value="35000">
                </div>
                <div>
                    <label>Aylık Harcaman (TL)</label>
                    <input type="number" id="expense" value="22000">
                </div>
                <div>
                    <label>Birikim Oranın (%)</label>
                    <input type="number" id="saveRate" value="25">
                </div>
                <div>
                    <label>Ev sahibi misin?</label>
                    <select id="home">
                        <option value="0">Kiradayım</option>
                        <option value="1">Ev sahibiyim</option>
                    </select>
                </div>
                <div>
                    <label>Araban var mı?</label>
                    <select id="car">
                        <option value="0">Yok</option>
                        <option value="1">Var</option>
                    </select>
                </div>
                <div>
                    <label>Çocuk planın var mı?</label>
                    <select id="kids">
                        <option value="0">Yok</option>
                        <option value="1">1 çocuk</option>
                        <option value="2">2+ çocuk</option>
                    </select>
                </div>
                <div>
                    <label>Yatırım tercihin?</label>
                    <select id="invest">
                        <option value="7">Banka (%7)</option>
                        <option value="12">Borsa/Fon (%12)</option>
                        <option value="15">Kripto/Agresif (%15)</option>
                    </select>
                </div>
            </div>

            <button onclick="showAdAndCalculate()">HESAPLA →</button>

            <div id="result"></div>
            <div class="share" id="share" style="display:none;">
                <p>Sonucunu paylaş, arkadaşlarını da şaşırt!</p>
                <a href="#" onclick="shareTwitter()">Twitter</a>
                <a href="#" onclick="shareWhatsApp()">WhatsApp</a>
                <a href="#" onclick="shareInstagram()">Instagram</a>
            </div>
        </div>
    </div>

    <!-- REKLAM (5 saniye tam ekran) -->
    <script>
    function showAdAndCalculate() {
        // Reklam göster (test için Google test ID'si)
        (adsbygoogle = window.adsbygoogle || []).push({});
        setTimeout(calculate, 5000); // 5 saniye reklamdan sonra hesapla
    }
    </script>

    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-3852960467508583"
         data-ad-slot="1234567890"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>

    <script>
    function calculate() {
        // ... (uzun hesaplama kodu, istersen eklerim ama şimdilik basit hali)
        document.getElementById('result').style.display = "block";
        document.getElementById('result').innerHTML = "<h2>Analiz tamamlandı, detaylar yakında!</h2>";
        document.getElementById('share').style.display = "block";
    }
    function shareTwitter() { window.open('https://twitter.com/intent/tweet?text=Ben Hesapçı’da hesapladım...'); }
    function shareWhatsApp() { window.open('https://wa.me/?text=Ben Hesapçı’da hesapladım...'); }
    function shareInstagram() { alert('Instagram hikayene eklemek için ekran görüntüsü al!'); }
    </script>
</body>
</html>
