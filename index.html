    <style>
        body { font-family: 'Inter', sans-serif; background:#f8fafc; color:#1e293b; padding:20px; min-height:100vh; }
        .container { max-width:800px; margin:40px auto; background:white; border-radius:24px; padding:60px; box-shadow:0 20px 60px rgba(0,0,0,0.08); }
        h1 { font-size:3.5em; text-align:center; color:#1e40af; margin-bottom:20px; }
        .subtitle { text-align:center; font-size:1.5em; color:#64748b; margin-bottom:50px; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-bottom:50px; }
        .full { grid-column:1/-1; }
        label { font-weight:600; color:#1e40af; margin-bottom:10px; display:block; }
        input, select { width:100%; padding:18px; border:2px solid #e2e8f0; border-radius:16px; font-size:1.2em; }
        input:focus, select:focus { border-color:#1e40af; outline:none; }
        button { width:100%; padding:24px; background:#1e40af; color:white; border:none; border-radius:20px; font-size:2em; font-weight:700; cursor:pointer; margin:50px 0; box-shadow:0 15px 40px rgba(30,64,175,0.3); }
        button:hover { background:#172554; }
        #result { margin-top:60px; padding:50px; background:#f0f9ff; border-radius:20px; border-left:8px solid #1e40af; font-size:1.6em; line-height:2; text-align:center; display:none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ne Kadar Zengin Olurdum?</h1>
        <p class="subtitle">Gelirini, kiranı, faturalarını, kahve bağımlılığını söyle... bakalım milyoner olacak mısın kanka 😂</p>

        <div class="form-grid">
            <div class="full"><label>Adın (isteğe bağlı)</label><input type="text" id="name" placeholder="Örn: Ahmet"></div>
            <div><label>Yaşın</label><input type="number" id="age" value="28"></div>
            <div><label>Aylık Net Gelirin (TL)</label><input type="number" id="income" value="40000"></div>
            <div><label>Kirada mısın?</label>
                <select id="kira" onchange="toggleKira()">
                    <option value="0">Hayır</option>
                    <option value="1">Evet</option>
                </select>
            </div>
            <div id="kiraDiv" style="display:none;">
                <label>Aylık Kira + Fatura (TL)</label>
                <input type="number" id="kiraMiktar" value="18000">
            </div>
            <div><label>Çocuk Sayısı</label><input type="number" id="kids" value="0"></div>
            <div><label>Araban var mı?</label>
                <select id="car"><option value="0">Yok</option><option value="1">Var</option></select>
            </div>
            <div><label>Ekstra Giderler (kahve, dışarı yemek, telefon vs.)</label>
                <input type="number" id="ekstra" value="8000">
            </div>
            <div class="full"><label>Yatırım Tarzın</label>
                <select id="invest">
                    <option value="7">Güvenli (%7 - altın, mevduat)</option>
                    <option value="10">Orta (%10 - borsa, fon)</option>
                    <option value="13">Yüksek (%13 - kripto)</option>
                </select>
            </div>
        </div>

        <button onclick="calculate()">HESAPLA KANKA!</button>

        <div id="result"></div>
    </div><!-- TAM EKRAN REKLAM (her hesaplama öncesi) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3852960467508583"
     crossorigin="anonymous"></script>

     style="display:block"

<script>

<script>
function calculate() {
    // 5 saniye tam ekran reklam
    (adsbygoogle = window.adsbygoogle || []).push({});
    setTimeout(() => {
        // burada gerçek hesaplama kodu gelecek
        document.getElementById('result').innerHTML = "<h2>REKLAM BİTTİ, HESAPLIYORUM...</h2>";
        document.getElementById('result').style.display = "block";
    }, 5000);
}
    <script>
    function toggleKira() {
        document.getElementById('kiraDiv').style.display = document.getElementById('kira').value == "1" ? "block" : "none";
    }

    function calculate() {
        const name = document.getElementById('name').value.trim() || "Kanka";
        const age = parseInt(document.getElementById('age').value) || 28;
        const income = parseFloat(document.getElementById('income').value) || 40000;
        const kira = parseInt(document.getElementById('kira').value);
        const kiraMiktar = kira ? parseFloat(document.getElementById('kiraMiktar').value) || 18000 : 0;
        const kids = parseInt(document.getElementById('kids').value) || 0;
        const car = parseInt(document.getElementById('car').value);
        const ekstra = parseFloat(document.getElementById('ekstra').value) || 8000;
        const investRate = parseFloat(document.getElementById('invest').value) / 100;

        let totalExpense = kiraMiktar + (kids * 10000) + (car * 8000) + ekstra;
        let monthlySave = income - totalExpense;

        if (monthlySave <= 0) {
            const komik = [
                `${name}, kanka senin maaşın yetmiyor bile! Aylık <strong>${Math.abs(monthlySave).toLocaleString()} TL</strong> açık... Kahve bağımlılığını bırak, aylık 1.000 TL kurtar 😂`,
                `Kanka, bu gidişle milyoner değil, <strong>borç kralı</strong> olursun. Biraz tutumlu ol, yoksa 65 yaşında emekli maaşına muhtaç kalırsın 😅`
            ];
            document.getElementById('result').innerHTML = `<h2>${komik[Math.floor(Math.random()*komik.length)]}</h2>`;
        } else {
            const yearsTo65 = 65 - age;
            let totalSavings = 0;
            for (let y = 1; y <= yearsTo65; y++) {
                totalSavings = (totalSavings + monthlySave * 12) * (1 + investRate);
            }

            const milyonerYasi = age + Math.ceil(10000000 / (monthlySave * 12));
            const ozgurlukAyi = Math.ceil(1200000 / monthlySave);

            const komik = [
                `${name}, helal olsun! Aylık <strong>${monthlySave.toLocaleString()} TL</strong> birikimle 65 yaşında <strong>${(totalSavings/1000000).toFixed(1)} MİLYON TL</strong> olacaksın! Yat mı alsan, ada mı alsan? 😎`,
                `Kanka, bu gidişle <strong>${milyonerYasi} yaşında milyoner olursun</strong>. O zamana kadar kahve içmeye devam, enerji lazım! 😂`,
                `${name}, senin torunların milyoner doğacak. Senin ne işin var burada hesap yapmakla? Git tatile çık! 💰`
            ];

            document.getElementById('result').innerHTML = `
                <h2>${komik[Math.floor(Math.random()*komik.length)]}</h2>
                <p>Finansal özgürlüğe <strong>${ozgurlukAyi} ay</strong> uzaktasın!</p>
                <p>Milyoner olmak için <strong>${milyonerYasi}</strong> yaşına kadar çalışman lazım!</p>
                <p>Aylık birikimin: <strong>${monthlySave.toLocaleString()} TL</strong> – bu tempo devam ederse kral olursun kanka!</p>
            `;
        }
        document.getElementById('result').style.display = "block";
    }
    </script>
</body>
</html>
