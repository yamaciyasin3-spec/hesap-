<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesapçı - Ne Kadar Zengin Olurdum?</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); border-radius: 30px; padding:50px; width:100%; max-width:600px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.2); }
        h1 { font-size:3em; color:#fff; text-align:center; margin-bottom:40px; text-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .input-group { margin:25px 0; }
        label { color:#fff; font-size:1.2em; display:block; margin-bottom:10px; }
        input { width:100%; padding:18px; border-radius:15px; border:none; font-size:1.3em; background:rgba(255,255,255,0.2); color:white; }
        input::placeholder { color:rgba(255,255,255,0.7); }
        button { width:100%; padding:20px; background: linear-gradient(45deg, #ff6b6b, #feca57); color:white; border:none; border-radius:20px; font-size:1.5em; font-weight:bold; cursor:pointer; margin-top:30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition:0.3s; }
        button:hover { transform:translateY(-5px); box-shadow:0 20px 40px rgba(0,0,0,0.4); }
        #result { margin-top:50px; padding:30px; background:rgba(255,255,255,0.15); border-radius:20px; font-size:1.4em; line-height:2; }
        .share { margin-top:30px; text-align:center; }
        .share a { color:white; margin:0 15px; font-size:1.3em; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ne Kadar Zengin Olurdum?</h1>
        
        <div class="input-group">
            <label>Yaşın</label>
            <input type="number" id="age" value="25">
        </div>
        <div class="input-group">
            <label>Aylık Gelirin (TL)</label>
            <input type="number" id="income" value="35000">
        </div>
        <div class="input-group">
            <label>Aylık Harcaman (TL)</label>
            <input type="number" id="expense" value="20000">
        </div>
        <div class="input-group">
            <label>Birikim Oranın (%)</label>
            <input type="number" id="saveRate" value="30">
        </div>
        
        <button onclick="calculate()">HESAPLA</button>
        
        <div id="result"></div>
        
        <div class="share">
            <p>Sonucunu paylaş:</p>
            <a href="#" onclick="shareTwitter()">Twitter</a> | 
            <a href="#" onclick="shareWhatsApp()">WhatsApp</a>
        </div>
    </div>

    <script>
    function calculate() {
        const age = parseInt(document.getElementById('age').value) || 25;
        const income = parseFloat(document.getElementById('income').value) || 35000;
        const expense = parseFloat(document.getElementById('expense').value) || 20000;
        const saveRate = (parseFloat(document.getElementById('saveRate').value) || 30) / 100;
        
        const monthlySave = (income - expense) + (income * saveRate);
        const annualSave = monthlySave * 12;
        const yearsTo65 = 65 - age;
        const totalSavings = annualSave * yearsTo65 * Math.pow(1.08, yearsTo65);
        
        document.getElementById('result').innerHTML = `
            <h2>SONUÇ</h2>
            <p>65 yaşında yaklaşık <strong>${(totalSavings/1000000).toFixed(1)} MİLYON TL</strong> birikimin olacak!</p>
            <p>Finansal özgürlüğe <strong>${Math.round(1000000/monthlySave)} ay</strong> uzaktasın!</p>
            <p>Milyoner olmak için <strong>${age + Math.round((10000000/annualSave))}</strong> yaşına kadar çalışman lazım!</p>
        `;
    }

    function shareTwitter() {
        window.open('https://twitter.com/intent/tweet?text=Ben%20${age}%20yaşındayım%20ve%20${(totalSavings/1000000).toFixed(1)}%20milyon%20TL%20olacağım!%20Sen%20hesapla:%20https://hesapci.vercel.app');
    }
    function shareWhatsApp() {
        window.open('https://wa.me/?text=Ben%20${age}%20yaşındayım%20ve%2065%20yaşında%20${(totalSavings/1000000).toFixed(1)}%20milyon%20TL%20olacağım!%20Sen%20de%20hesapla:%20https://hesapci.vercel.app');
    }
    </script>
</body>
</html>
